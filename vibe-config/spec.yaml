schemaVersion: "2"
kind: mixin
name: vibe-config
version: "0.1.0"
displayName: Vibe config seeding
description: Seeds config.toml, agents, prompts and skills into ~/.vibe at every sandbox start
licenses:
  - Apache-2.0

setup:
  startup:
    - command:
        - sh
        - -c
        - |
          set -eu
          SEED=/home/agent/vibe-seed
          TARGET=/home/agent/.vibe
          [ -d "$SEED" ] || exit 0
          mkdir -p "$TARGET"
          if [ -f "$SEED/config.toml" ] && [ ! -f "$TARGET/config.toml" ]; then
            cp "$SEED/config.toml" "$TARGET/config.toml"
          fi
          for d in agents prompts skills; do
            if [ -d "$SEED/$d" ]; then
              rm -rf "$TARGET/$d"
              mkdir -p "$TARGET/$d"
              cp -r "$SEED/$d/." "$TARGET/$d/"
            fi
          done
          chown -R agent:agent "$TARGET"
      user: "0"
      description: Seed ~/.vibe from bundled vibe-seed after volume mount
