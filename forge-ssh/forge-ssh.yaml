# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Forge SSH
description: Pins host keys for github.com and codeberg.org and forwards the
  host SSH agent, bounded to git logins against both forges.
licenses: [Apache-2.0]

kind: mixin

# Bump when these declarations change.
version: "0.1.0"

# Names the effect for other kits to order against (e.g. a clone mixin).
provides: ["forge-ssh"]

# Stated assumptions rather than quietly inherited from the base:
#   deb/openssh-client  ssh-keyscan for Codeberg host keys, SSH transport.
#   deb/jq              the hook pipes api.github.com/meta through jq.
requires: ["deb/openssh-client", "deb/jq"]

capabilities:
  # One socket, both forges. Entries for the same phase merge across the kit
  # set with the union of their lists; git-ssh-sign's sign:[git] collapses
  # into this entry. unrestricted stays false: only what the lists name.
  - type: com.docker.sandbox/ssh-agent@1
    config:
      phase: runtime
      unrestricted: false
      authenticate: [git@github.com, git@codeberg.org]
      sign: [git]

  # Install phase: the hosts the hooks reach. Runtime: both forges for
  # clone, fetch, push. api.github.com stays runtime-free here unless gh
  # key cross-checks are wanted later (git-ssh-sign declares it itself).
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - api.github.com
          - codeberg.org
      runtime:
        allow:
          - github.com
          - codeberg.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -e
            mkdir -p /home/agent/.ssh
            chmod 700 /home/agent/.ssh
            # GitHub: authoritative host keys from the meta endpoint.
            curl -s https://api.github.com/meta \
              | jq -r '.ssh_keys[] | "github.com " + .' \
              >> /home/agent/.ssh/known_hosts
            # Codeberg: keyscan is TOFU; the authoritative fingerprints are
            # published at docs.codeberg.org/security/ssh-fingerprint/
            # and in the Imprint. Verify once after the first build.
            ssh-keyscan -t ed25519,ecdsa-sha2-nistp256 codeberg.org \
              >> /home/agent/.ssh/known_hosts 2>/dev/null
            chmod 644 /home/agent/.ssh/known_hosts
            chown -R agent:agent /home/agent/.ssh
          user: "0"
          description: Pin GitHub and Codeberg host keys

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./forge-ssh-context.md
